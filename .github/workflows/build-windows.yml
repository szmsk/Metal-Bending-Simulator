name: Build FalconBEND (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test TypeScript configuration
        run: node --test tests/dependencyConfig.test.mjs
      - name: Install packages and check web application
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Generate embedded source archive
        run: python scripts/bundle_sources.py
      - name: Test launcher
        working-directory: launcher
        run: go test ./...
      - name: Build FalconBEND.exe
        working-directory: launcher
        shell: pwsh
        run: |
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -ldflags="-H windowsgui" -o ../FalconBEND.exe .
      - name: Upload Windows program
        uses: actions/upload-artifact@v4
        with:
          name: FalconBEND-Windows-v3.9.1
          path: |
            FalconBEND.exe
            Zamknij_FalconBEND.vbs
            FalconBEND.ico
            README_URUCHOMIENIE.txt
          if-no-files-found: error
